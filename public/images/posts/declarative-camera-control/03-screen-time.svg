  <rect x="424" y="477" width="716" height="43" rx="10" fill="#0f766e"/>
  <text x="235" y="507" text-anchor="middle" class="small white">镜头 A</text>
  <text x="782" y="507" text-anchor="middle" class="small white">镜头 B 的可用时间区间</text>
  <path d="M419 458V540" stroke="#d58b27" stroke-width="4"/>
  <text x="60" y="567" class="small muted">动作开始</text>
  <text x="419" y="567" text-anchor="middle" class="small amber">切换机位</text>
  <text x="1140" y="567" text-anchor="end" class="small muted">甲停下 · 动作时间 →</text>
  <text x="52" y="610" class="small">画面条件与角色轨迹共同约束起止时间；切镜仍须结合整段拍摄方案。</text>
  <text x="52" y="643" class="small muted">教学示意 · 虚影表示较早位置；位置与时间非测量值；非原论文图示复刻</text>
</svg>