<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">画面位置与镜头时间：甲在门边接近乙</title>
  <desc id="desc">原创教学示意。先用双人远景交代距离，再切到中景：甲从左侧入画，走向门边的乙并停下。中景画框以虚线轨迹显示甲的画面运动，下面的时间轴展示两个镜头覆盖动作的区间和切镜边界。位置与时间并非测量值。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0f766e"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#17334b}.title{font-size:34px;font-weight:700}.sub{font-size:23px;fill:#526879}.label{font-size:27px;font-weight:700}.small{font-size:22px}.muted{fill:#526879}.white{fill:#fff}.teal{fill:#0f766e}.amber{fill:#a35b0a}.body{stroke:#0f766e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.body-b{stroke:#17334b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="660" fill="#f7fafb"/>
  <text x="52" y="60" class="title">画面要求，也在约束镜头的时间</text>
  <text x="52" y="99" class="sub">同一段“甲接近乙并在门边停下”的动作，用远景与中景共同覆盖</text>
  <text x="64" y="151" class="label">镜头 A · 双人远景交代距离</text>
  <text x="654" y="151" class="label">镜头 B · 中景观察接近</text>
  <rect x="60" y="171" width="500" height="220" rx="14" fill="#fff" stroke="#cad7df" stroke-width="2"/>
  <rect x="644" y="171" width="496" height="220" rx="14" fill="#fff" stroke="#cad7df" stroke-width="2"/>
  <path d="M79 353H541M663 353H1121" stroke="#d7e1e7" stroke-width="2"/>
  <path d="M494 353V236H533V353M1098 353V212H1132V353" fill="#f0e9dd" stroke="#b3a58d" stroke-width="3"/>
