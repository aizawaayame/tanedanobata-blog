  <path d="M145 296V326M145 307L127 320M145 307L163 320M145 326L132 349M145 326L158 349" class="body"/>
  <circle cx="458" cy="273" r="20" fill="#eaf0f4" stroke="#17334b" stroke-width="3"/>
  <text x="458" y="281" text-anchor="middle" class="small">乙</text>
  <path d="M458 296V326M458 307L440 320M458 307L476 320M458 326L445 349M458 326L471 349" class="body-b"/>
  <path d="M185 242H411" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="300" y="221" text-anchor="middle" class="small muted">甲向门边的乙走去</text>
  <g opacity="0.35">
    <circle cx="698" cy="257" r="24" fill="#e2f3ef" stroke="#0f766e" stroke-width="3"/>
    <text x="698" y="265" text-anchor="middle" class="small teal">甲</text>
    <path d="M698 284V320M698 296L676 311M698 296L720 311M698 320L682 347M698 320L714 347" class="body"/>
  </g>
  <path d="M731 291H947" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <circle cx="984" cy="257" r="24" fill="#e2f3ef" stroke="#0f766e" stroke-width="3"/>
  <text x="984" y="265" text-anchor="middle" class="small teal">甲</text>
  <path d="M984 284V320M984 296L962 311M984 296L1006 311M984 320L968 347M984 320L1000 347" class="body"/>
  <circle cx="1066" cy="257" r="24" fill="#eaf0f4" stroke="#17334b" stroke-width="3"/>
  <text x="1066" y="265" text-anchor="middle" class="small">乙</text>
  <path d="M1066 284V320M1066 296L1044 311M1066 296L1088 311M1066 320L1050 347M1066 320L1082 347" class="body-b"/>
  <text x="679" y="217" class="small teal">左侧入画</text>
  <text x="933" y="217" class="small amber">在乙旁停下</text>
