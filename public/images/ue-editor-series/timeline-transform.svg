<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">时间轴只有一套坐标变换</title><desc id="desc">绘制、命中和缩放共享 ViewStart、OriginX 与 PixelsPerSecond。。缩放时先记录鼠标下的时间，再反算新的 ViewStart；不要重复应用 DPI 缩放。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">时间轴只有一套坐标变换</text><text x="36" y="77" font-size="16" fill="#475569">绘制、命中和缩放共享 ViewStart、OriginX 与 PixelsPerSecond。</text>
<rect x="35" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="146" font-size="19" font-weight="700" fill="#2563eb">屏幕坐标</text><text x="53" y="175" font-size="16" fill="#334155">鼠标事件位置</text><text x="53" y="198" font-size="16" fill="#334155">Geometry.AbsoluteToLocal</text><rect x="365" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="146" font-size="19" font-weight="700" fill="#2563eb">控件局部坐标</text><text x="383" y="175" font-size="16" fill="#334155">X：横向位置</text><text x="383" y="198" font-size="16" fill="#334155">统一绘图区边界</text><rect x="705" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="146" font-size="19" font-weight="700" fill="#2563eb">时间坐标</text><text x="723" y="175" font-size="16" fill="#334155">T：秒</text><text x="723" y="198" font-size="16" fill="#334155">片段与游标共用</text><path d="M305 170 L365 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 160 L705 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 190 L635 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="275" width="740" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="148" y="306" font-size="19" font-weight="700" fill="#0f766e">互逆公式</text><text x="148" y="335" font-size="16" fill="#334155">X = OriginX + (T − ViewStart) × PixelsPerSecond</text><text x="148" y="358" font-size="16" fill="#334155">T = ViewStart + (X − OriginX) / PixelsPerSecond</text><text x="36" y="427" font-size="17" fill="#475569">缩放时先记录鼠标下的时间，再反算新的 ViewStart；不要重复应用 DPI 缩放。</text></g></svg>