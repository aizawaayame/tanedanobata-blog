<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">预览视口的持有关系与退出顺序</title><desc id="desc">场景必须比使用它的客户端活得久；组件必须在场景释放前解除关联。。RF_Transient 不负责销毁；实时视口刷新也不等于世界与动画已经正确推进。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">预览视口的持有关系与退出顺序</text><text x="36" y="77" font-size="16" fill="#475569">场景必须比使用它的客户端活得久；组件必须在场景释放前解除关联。</text>
<rect x="35" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="146" font-size="19" font-weight="700" fill="#2563eb">SEditorViewport</text><text x="53" y="175" font-size="16" fill="#334155">Slate 控件与输入入口</text><text x="53" y="198" font-size="16" fill="#334155">观察关闭与焦点变化</text><rect x="365" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="146" font-size="19" font-weight="700" fill="#2563eb">Viewport Client</text><text x="383" y="175" font-size="16" fill="#334155">相机、Draw、拾取</text><text x="383" y="198" font-size="16" fill="#334155">使用场景但不能晚于它退出</text><rect x="705" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="146" font-size="19" font-weight="700" fill="#2563eb">FPreviewScene</text><text x="723" y="175" font-size="16" fill="#334155">独立预览世界</text><text x="723" y="198" font-size="16" fill="#334155">管理加入的组件</text><path d="M305 170 L365 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 170 L705 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="95" y="275" width="810" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="113" y="306" font-size="19" font-weight="700" fill="#0f766e">退出顺序</text><text x="113" y="335" font-size="16" fill="#334155">停止输入与异步结果 → 取消手势与播放 → 解除组件关联</text><text x="113" y="358" font-size="16" fill="#334155">停止客户端与视口使用 → 释放场景及剩余持有引用</text><text x="36" y="427" font-size="17" fill="#475569">RF_Transient 不负责销毁；实时视口刷新也不等于世界与动画已经正确推进。</text></g></svg>