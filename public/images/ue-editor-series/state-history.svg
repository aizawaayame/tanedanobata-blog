<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">历史、当前内容与保存基线</title><desc id="desc">Revision 用于通知变化；Dirty 比较内容；两者不是同一个状态。。撤销到保存内容时可以恢复干净状态，即使 Revision 继续递增。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">历史、当前内容与保存基线</text><text x="36" y="77" font-size="16" fill="#475569">Revision 用于通知变化；Dirty 比较内容；两者不是同一个状态。</text>
<rect x="35" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="146" font-size="19" font-weight="700" fill="#2563eb">Undo / 撤销</text><text x="53" y="175" font-size="16" fill="#334155">保存前一内容状态</text><text x="53" y="198" font-size="16" fill="#334155">一次手势只生成一条</text><rect x="365" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="146" font-size="19" font-weight="700" fill="#2563eb">Current / 当前内容</text><text x="383" y="175" font-size="16" fill="#334155">更新、取消、撤销、重做</text><text x="383" y="198" font-size="16" fill="#334155">都可能改变内容版本</text><rect x="705" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="146" font-size="19" font-weight="700" fill="#2563eb">Redo / 重做</text><text x="723" y="175" font-size="16" fill="#334155">保存被撤销的状态</text><text x="723" y="198" font-size="16" fill="#334155">实际新编辑才清空</text><path d="M295 160 L365 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 190 L295 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 160 L705 160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 190 L635 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="275" width="460" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="288" y="306" font-size="19" font-weight="700" fill="#0f766e">Saved / 保存基线</text><text x="288" y="335" font-size="16" fill="#334155">只有写入并回读成功才更新</text><text x="288" y="358" font-size="16" fill="#334155">Dirty = 当前内容与保存基线不同</text><path d="M500 225 L500 275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="427" font-size="17" fill="#475569">撤销到保存内容时可以恢复干净状态，即使 Revision 继续递增。</text></g></svg>