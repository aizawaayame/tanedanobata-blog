<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">EditorLab：职责与数据流</title><desc id="desc">操作进入会话；文档是数据源；预览和保存是两个不同的输出。。窗口关闭不等于数据已保存；预览对象销毁后应能从文档重建。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">EditorLab：职责与数据流</text><text x="36" y="77" font-size="16" fill="#475569">操作进入会话；文档是数据源；预览和保存是两个不同的输出。</text>
<rect x="35" y="120" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="151" font-size="19" font-weight="700" fill="#2563eb">View / 界面</text><text x="53" y="180" font-size="16" fill="#334155">图、列表、时间轴、视口</text><text x="53" y="203" font-size="16" fill="#334155">选择与输入意图</text><rect x="365" y="120" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="151" font-size="19" font-weight="700" fill="#2563eb">Session / 会话</text><text x="383" y="180" font-size="16" fill="#334155">修改、校验、历史与版本</text><text x="383" y="203" font-size="16" fill="#334155">持有 Document 文档</text><rect x="705" y="120" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="151" font-size="19" font-weight="700" fill="#2563eb">Preview / 预览</text><text x="723" y="180" font-size="16" fill="#334155">读取有效输入快照</text><text x="723" y="203" font-size="16" fill="#334155">输出临时画面和声音</text><rect x="365" y="270" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="301" font-size="19" font-weight="700" fill="#2563eb">Storage / 保存</text><text x="383" y="330" font-size="16" fill="#334155">检查来源 → 写入 → 回读</text><text x="383" y="353" font-size="16" fill="#334155">成功后更新保存基线</text><path d="M295 175 L365 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 175 L705 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 230 L500 270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="427" font-size="17" fill="#475569">窗口关闭不等于数据已保存；预览对象销毁后应能从文档重建。</text></g></svg>