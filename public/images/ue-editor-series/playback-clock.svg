<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">播放与定位：同一目标时间，不同求值路径</title><desc id="desc">主时间决定片段和局部时间；音频只在启动、跳转或切换时重新定位。。共享主时间不等于样本级同步；实际姿态与声音必须分别验证。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">播放与定位：同一目标时间，不同求值路径</text><text x="36" y="77" font-size="16" fill="#475569">主时间决定片段和局部时间；音频只在启动、跳转或切换时重新定位。</text>
<rect x="35" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="146" font-size="19" font-weight="700" fill="#2563eb">Playing / 播放</text><text x="53" y="175" font-size="16" fill="#334155">单调时钟计算经过时间</text><text x="53" y="198" font-size="16" fill="#334155">查找最终所属片段</text><rect x="365" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="146" font-size="19" font-weight="700" fill="#2563eb">Target / 目标时间</text><text x="383" y="175" font-size="16" fill="#334155">片段 ID 与局部时间</text><text x="383" y="198" font-size="16" fill="#334155">动画、视图读取同一输入</text><rect x="705" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="146" font-size="19" font-weight="700" fill="#2563eb">Paused / 暂停定位</text><text x="723" y="175" font-size="16" fill="#334155">停止旧声音并 Seek</text><text x="723" y="198" font-size="16" fill="#334155">不连续求值，保持暂停</text><path d="M305 170 L365 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 170 L635 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="275" width="580" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="228" y="306" font-size="19" font-weight="700" fill="#0f766e">输出与验证</text><text x="228" y="335" font-size="16" fill="#334155">动画按绝对时间采样；声音连续播放而非每帧重启</text><text x="228" y="358" font-size="16" fill="#334155">设备、资源格式与线程调度决定实际同步表现</text><path d="M500 225 L500 275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="427" font-size="17" fill="#475569">共享主时间不等于样本级同步；实际姿态与声音必须分别验证。</text></g></svg>