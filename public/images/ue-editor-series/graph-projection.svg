<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">源图与显示投影</title><desc id="desc">显示节点可以重建；选择和跳转通过稳定的源 ID 找回文档。。布局必须终止；不可达节点也应可见；浏览选择不隐式改变预览。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="25" font-weight="700" fill="#0f172a">源图与显示投影</text><text x="36" y="77" font-size="16" fill="#475569">显示节点可以重建；选择和跳转通过稳定的源 ID 找回文档。</text>
<rect x="35" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="53" y="146" font-size="19" font-weight="700" fill="#2563eb">源数据</text><text x="53" y="175" font-size="16" fill="#334155">A → B → C</text><text x="53" y="198" font-size="16" fill="#334155">C → A 是回边</text><rect x="365" y="115" width="270" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="383" y="146" font-size="19" font-weight="700" fill="#2563eb">主显示</text><text x="383" y="175" font-size="16" fill="#334155">A → B → C</text><text x="383" y="198" font-size="16" fill="#334155">每个源节点一份主显示</text><rect x="705" y="115" width="260" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="723" y="146" font-size="19" font-weight="700" fill="#2563eb">返回引用</text><text x="723" y="175" font-size="16" fill="#334155">C → 返回 A</text><text x="723" y="198" font-size="16" fill="#334155">独立显示身份，指向 A</text><path d="M305 170 L365 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 170 L705 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="275" width="600" height="110" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="218" y="306" font-size="19" font-weight="700" fill="#0f766e">汇合与循环需要区分</text><text x="218" y="335" font-size="16" fill="#334155">已访问过的节点可能只是汇合，不一定形成循环。</text><text x="218" y="358" font-size="16" fill="#334155">识别回边需要当前递归路径或强连通分量分析。</text><text x="36" y="427" font-size="17" fill="#475569">布局必须终止；不可达节点也应可见；浏览选择不隐式改变预览。</text></g></svg>